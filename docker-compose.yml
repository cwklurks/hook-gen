services:
  # Local development: run backend and frontend separately
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./hook-aid/examples:/app/examples:ro
    environment:
      - PYTHONUNBUFFERED=1

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      # For local dev, frontend calls backend directly via browser
      # This requires CORS on backend for local dev
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend

  # Production-like: single container with both
  production:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    profiles:
      - production
