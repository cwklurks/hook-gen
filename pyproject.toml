[tool.ruff]
# Set line length
line-length = 100

# Exclude common directories
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "venv",
    "node_modules",
    "out",
    ".next",
    "outputs",
]

[tool.ruff.lint]
# Enable specific rule sets
select = [
    "E",  # pycodestyle errors
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
]

[tool.ruff.lint.isort]
known-first-party = ["backend", "hook-aid"]

[tool.mypy]
# Enable type checking (relaxed from strict for gradual adoption)
python_version = "3.10"
explicit_package_bases = true
mypy_path = "$MYPY_CONFIG_FILE_DIR/backend:$MYPY_CONFIG_FILE_DIR/hook-aid:$MYPY_CONFIG_FILE_DIR/packages"

# Core checks (enabled)
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true

# Strict checks (disabled for gradual adoption)
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_decorators = false
no_implicit_optional = false

# Ignore missing imports for libraries without type stubs
[[tool.mypy.overrides]]
module = [
    "librosa",
    "librosa.*",
    "mido",
    "mido.*",
    "pretty_midi",
    "pretty_midi.*",
    "soundfile",
    "soundfile.*",
    "fastapi",
    "fastapi.*",
    "uvicorn",
    "uvicorn.*",
    "streamlit",
    "streamlit.*",
    "numpy.*",
    "pydantic",
    "pydantic.*",
    "slowapi",
    "slowapi.*",
    "starlette",
    "starlette.*",
    "pytest",
    "pytest.*",
]
ignore_missing_imports = true

# Configuration for specific directories
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "scripts.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "hook-aid.*"
disallow_untyped_defs = false

